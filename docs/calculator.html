
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Snake Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: sans-serif;
    }
    canvas {
      border: 2px solid #fff;
      background-color: #000;
    }
  </style>
</head>
<body>
  <h2>Score: <span id="score">0</span></h2>
  <canvas id="game" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const box = 20; // Size of each grid square
    let score = 0;
    let snake = [{ x: 10 * box, y: 10 * box }]; // Snake starts in the center
    let food = spawnFood();
    let dx = box; // Moving right initially
    let dy = 0;

    // Listen for arrow key presses
    document.addEventListener("keydown", changeDirection);

    function changeDirection(event) {
      const key = event.key;
      // Prevent the snake from reversing directly into itself
      if (key === "ArrowLeft" && dx === 0) { dx = -box; dy = 0; }
      if (key === "ArrowUp" && dy === 0) { dx = 0; dy = -box; }
      if (key === "ArrowRight" && dx === 0) { dx = box; dy = 0; }
      if (key === "ArrowDown" && dy === 0) { dx = 0; dy = box; }
    }

    function spawnFood() {
      return {
        x: Math.floor(Math.random() * (canvas.width / box)) * box,
        y: Math.floor(Math.random() * (canvas.height / box)) * box
      };
    }

    function draw() {
      // Clear the canvas
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw the food
      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, box, box);

      // Draw the snake
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "lime" : "green";
        ctx.fillRect(segment.x, segment.y, box - 1, box - 1);
      });

      // Calculate new head position
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Check wall or self collisions
      if (
        head.x < 0 || head.x >= canvas.width ||
        head.y < 0 || head.y >= canvas.height ||
        snake.some(segment => segment.x === head.x && segment.y === head.y)
      ) {
        clearInterval(gameLoop);
        alert("Game Over! Final Score: " + score);
        location.reload();
        return;
      }

      // Add new head to the front of the snake
      snake.unshift(head);

      // Check if snake ate the food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        food = spawnFood(); // Keep the tail so the snake grows
      } else {
        snake.pop(); // Remove the tail to maintain current length
      }
    }

    // Run the game loop every 100ms (10 frames per second)
    const gameLoop = setInterval(draw, 100);
  </script>
</body>
</html>
